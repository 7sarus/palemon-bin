name: Build packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release with the built packages
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'palemoon-gtk2/**'
      - 'palemoon-gtk3/**'
      - '.github/workflows/build.yml'
  schedule:
    # weekly check for new upstream releases (Mon 04:23 UTC)
    - cron: '23 4 * * 1'

jobs:
  build:
    name: Build ${{ matrix.pkgname }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        pkgname: [palemoon-gtk3, palemoon-gtk2]
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tooling
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git base-devel
          # install this package's runtime deps as root, since makepkg runs
          # unprivileged below and cannot do it itself
          mapfile -t deps < <(bash -c 'source "${{ matrix.pkgname }}/PKGBUILD" >/dev/null 2>&1; printf "%s\n" "${depends[@]}"')
          # makepkg refuses to run as root, and containers start as root
          useradd -m builder
          # unprivileged makepkg shells out to sudo for -s / check deps
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # gtk2 was dropped from the official repos in Oct 2025 and is AUR-only,
          # so the gtk2 package needs it built from AUR first
          if printf '%s\n' "${deps[@]}" | grep -qx gtk2 && ! pacman -Si gtk2 >/dev/null 2>&1; then
            echo "gtk2 not in official repos, building from AUR"
            git clone --depth 1 https://aur.archlinux.org/gtk2.git /tmp/gtk2-aur
            # install gtk2's own deps as root first: the unprivileged makepkg
            # below cannot use pacman -s to resolve them
            mapfile -t g2deps < <(bash -c 'cd /tmp/gtk2-aur && source ./PKGBUILD >/dev/null 2>&1; printf "%s\n" "${depends[@]}" "${makedepends[@]}"')
            echo "gtk2 AUR deps: ${g2deps[*]}"
            [ ${#g2deps[@]} -eq 0 ] || pacman -S --noconfirm --needed "${g2deps[@]}"
            chown -R builder /tmp/gtk2-aur
            # makepkg has no -C: enter the dir in a subshell instead
            sudo -u builder bash -c 'cd /tmp/gtk2-aur && makepkg -sCf --noprogressbar'
            g2pkg=$(find /tmp/gtk2-aur -maxdepth 1 -name 'gtk2-*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)
            echo "AUR gtk2 package: ${g2pkg:-NOT FOUND}"
            test -n "$g2pkg" && pacman -U --noconfirm "$g2pkg"
          fi
          pacman -Syu --noconfirm --needed "${deps[@]}"

      - name: Detect latest upstream version
        id: detect
        run: |
          set -euo pipefail
          latest=$(curl -sL https://www.palemoon.org/download.shtml \
            | grep -oP 'Hashes for release \K[0-9.]+' | head -n1)
          test -n "$latest" || { echo "::error::could not detect upstream version"; exit 1; }
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $latest"

      - name: Sync PKGBUILD to upstream version
        id: bump
        working-directory: ${{ matrix.pkgname }}
        env:
          UPSTREAM: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          sudo -u builder sed -i -E "s/^pkgver=.*/pkgver=${UPSTREAM}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # regenerate the sha256 list against the freshly downloaded source
          sudo -u builder makepkg -g --noprogressbar
          git --no-pager diff -- PKGBUILD || true

      - name: Build package
        id: build
        working-directory: ${{ matrix.pkgname }}
        env:
          MAKEFLAGS: "-j2"
        run: |
          set -euo pipefail
          sudo -u builder makepkg -sf --noconfirm --noprogressbar
          # exclude the -debug split package
          pkg=$(ls -1 ./*.pkg.tar.zst | grep -v -- '-debug-')
          echo "asset=$(basename "$pkg")" >> "$GITHUB_OUTPUT"
          sudo -u builder sha256sum "$pkg" > "${pkg}.sig"
          echo "Building $pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: palemoon-${{ matrix.pkgname }}
          path: ${{ matrix.pkgname }}/*.pkg.tar.zst*

      - name: Commit updated PKGBUILD
        run: |
          run: |
          set -uo pipefail
          repo="$GITHUB_WORKSPACE"
          git -C "$repo" config --global --add safe.directory '*'
          git -C "$repo" config user.name github-actions[bot]
          git -C "$repo" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$repo" add "${{ matrix.pkgname }}/PKGBUILD"
          if git -C "$repo" diff --cached --quiet; then
            echo "PKGBUILD already up to date"
          else
            git -C "$repo" commit -m "chore(${{ matrix.pkgname }}): update to ${{ steps.detect.outputs.version }}"
            # never fail the build on a concurrent-push race; the next run retries
            git -C "$repo" pull --rebase --autostash origin main || true
            git -C "$repo" push || echo "::warning::push failed, will retry on next run"
          fi

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        working-directory: ${{ matrix.pkgname }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: palemoon-${{ steps.detect.outputs.version }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sig" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Pale Moon ${{ steps.detect.outputs.version }}" --generate-notes \
              "$ASSET" "$ASSET.sig"
          fi